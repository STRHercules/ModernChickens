plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = "${minecraft_version}-${mod_version}-${tag_lanzador}"
group = "${group}"
base {
    archivesName = "${mod_name}"
}

// Minecraft 1.20.1 ships Java 17 to end users, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Remap the refmaps of deobfuscated dependency mods so their mixins
            // resolve against the named mappings used in the dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    // KubeJS + Rhino
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    // Architectury (KubeJS runtime dependency)
    maven {
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
}

// Some dev-only mods (KubeJS in particular) keep non-daemon threads alive, which
// stops the data generator JVM from exiting. They are only needed to exercise the
// integrations in the client, so leave them off the classpath during data generation.
def dataGenRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains("rundata") }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // WTHIT
    compileOnly fg.deobf("mcp.mobius.waila:wthit-api:forge-${wthit_version}")
    if (!dataGenRun) {
        runtimeOnly fg.deobf("mcp.mobius.waila:wthit:forge-${wthit_version}")
        runtimeOnly fg.deobf("maven.modrinth:badpackets:${badpackets_version}")
    }

    // Jade
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")

    // KubeJS (the plugin itself is discovered through kubejs.plugins.txt at runtime)
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    compileOnly fg.deobf("dev.latvian.mods:rhino:${rhino_version}")
    if (!dataGenRun) {
        runtimeOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
        runtimeOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    }

    // AlmostUnified
    compileOnly fg.deobf("com.almostreliable.mods:almostunified-forge:${au_version}")
    runtimeOnly fg.deobf("com.almostreliable.mods:almostunified-forge:${au_version}")

    // Mekanism is reached purely through reflection, so no compile-time artifact is
    // required; it is only present at runtime so data generation can resolve its items.
    runtimeOnly fg.deobf("mekanism:Mekanism:${minecraft_version}-${mekanism_version}")
}

test {
    enabled = false
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_named: mod_named,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        issues: issues,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(17)
    options.compilerArgs << '-Xmaxerrs' << '20000'
}

// Mixin refmaps of deobfuscated dependency mods are written in SRG names; the
// remapping file above must exist before any run configuration starts.
tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn 'createSrgToMcp'
}
