# For built-ins, the normal editable fields are enabled, layCoefficient,
# spawnType, allowNaturalSpawn, parent1, parent2, layItemName,
# layItemAmount, layItemMeta, dropItemName, dropItemAmount, dropItemMeta,
# and liquidDousingCost.

